appId: com.appclase.app
productName: AppClase
copyright: AppClase
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AppClase
  artifactName: AppClase-Setup-${version}.exe
  installerLanguages: [es_ES]
  language: "3082"
  uninstallDisplayName: AppClase
linux:
  icon: build/icon.png
  target: [AppImage]
# El actualizador busca las versiones nuevas en las Releases de este repositorio.
# Se indica explícitamente para no depender de cómo esté escrito el remoto git.
# Las versiones deben ser públicas (no borradores) para que el actualizador las encuentre.
publish:
  provider: github
  owner: JorgeeCiscar
  repo: AppClase
  releaseType: release
